<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Car Racing</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #168a32;
    font-family: Arial, sans-serif;
    touch-action: none;
}

/* GAME */
#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* ROAD */
#road {
    position: absolute;
    top: 0;
    bottom: 0;

    width: 70%;
    left: 15%;

    background: #444;
}

/* ROAD BORDER */
#road::before,
#road::after {
    content: "";
    position: absolute;
    top: 0;
    height: 100%;
    width: 6px;
    background: white;
}

#road::before {
    left: 0;
}

#road::after {
    right: 0;
}

/* ROAD LINES */
.line {
    position: absolute;

    width: 8px;
    height: 70px;

    background: white;

    left: 50%;
    transform: translateX(-50%);
}

/* CARS */
.car {
    position: absolute;

    width: 50px;
    height: 90px;

    border-radius: 8px;

    z-index: 5;
}

/* PLAYER */
#player {
    background: #087cff;

    left: calc(50% - 25px);
    bottom: 150px;
}

/* WINDOW */
.car::before {
    content: "";

    position: absolute;

    width: 30px;
    height: 20px;

    left: 10px;
    top: 14px;

    background: white;

    border-radius: 3px;
}

/* WHEELS */
.car::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 20px;

    left: -5px;
    top: 15px;

    background: black;

    box-shadow:
        53px 0 black,
        0 40px black,
        53px 40px black;
}

/* ENEMY */
.enemy {
    background: red;
}

/* SCORE */
#score {
    position: fixed;

    top: 15px;
    left: 15px;

    color: white;

    font-size: 25px;
    font-weight: bold;

    z-index: 50;
}

/* =========================
   MOBILE CONTROLS
========================= */

#controls {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 20px;

    width: 100%;

    display: flex;
    justify-content: space-between;

    padding: 0 20px;

    z-index: 100;
}

/* BUTTON */
.control {
    width: 140px;
    height: 65px;

    border: 3px solid white;
    border-radius: 18px;

    background: rgba(0, 0, 0, 0.75);

    color: white;

    font-size: 20px;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

/* BUTTON PRESS */
.control:active {
    background: rgba(255,255,255,0.4);
}

/* GAME OVER */
#gameOver {
    position: fixed;

    inset: 0;

    display: none;

    background: rgba(0,0,0,0.75);

    color: white;

    z-index: 200;

    text-align: center;

    padding-top: 40vh;
}

#gameOver h1 {
    color: yellow;
    font-size: 45px;
}

#restart {
    margin-top: 20px;

    width: 180px;
    height: 60px;

    border: none;
    border-radius: 15px;

    background: white;

    font-size: 20px;
    font-weight: bold;
}

</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="score">
        Score: 0
    </div>

    <div id="player" class="car"></div>

    <!-- CONTROLS -->
    <div id="controls">

        <div id="left" class="control">
            ◀ LEFT
        </div>

        <div id="right" class="control">
            RIGHT ▶
        </div>

    </div>

    <!-- GAME OVER -->
    <div id="gameOver">

        <h1>GAME OVER</h1>

        <p>
            Score:
            <span id="finalScore">0</span>
        </p>

        <button id="restart">
            RESTART
        </button>

    </div>

</div>


<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");

const scoreDisplay = document.getElementById("score");

let playerX = 0;

let enemies = [];

let score = 0;

let speed = 5;

let gameRunning = true;

let moveLeft = false;
let moveRight = false;


/* =====================
   PLAYER POSITION
===================== */

function resetPlayer() {

    playerX =
        game.clientWidth / 2 - 25;

    player.style.left =
        playerX + "px";
}

resetPlayer();


/* =====================
   TOUCH CONTROLS
===================== */

leftButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        moveLeft = true;
    }
);

rightButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        moveRight = true;
    }
);


/* Stop movement */

leftButton.addEventListener(
    "pointerup",
    function() {

        moveLeft = false;
    }
);

rightButton.addEventListener(
    "pointerup",
    function() {

        moveRight = false;
    }
);

leftButton.addEventListener(
    "pointerleave",
    function() {

        moveLeft = false;
    }
);

rightButton.addEventListener(
    "pointerleave",
    function() {

        moveRight = false;
    }
);


/* =====================
   KEYBOARD SUPPORT
===================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "ArrowLeft")
            moveLeft = true;

        if (e.key === "ArrowRight")
            moveRight = true;
    }
);

document.addEventListener(
    "keyup",
    function(e) {

        if (e.key === "ArrowLeft")
            moveLeft = false;

        if (e.key === "ArrowRight")
            moveRight = false;
    }
);


/* =====================
   ROAD LINES
===================== */

let lines = [];

for (let i = 0; i < 10; i++) {

    let line =
        document.createElement("div");

    line.className = "line";

    line.style.top =
        (i * 100) + "px";

    game.appendChild(line);

    lines.push(line);
}


function moveRoad() {

    lines.forEach(function(line) {

        let y =
            parseFloat(line.style.top);

        y += speed;

        if (y > game.clientHeight) {

            y = -70;
        }

        line.style.top =
            y + "px";
    });
}


/* =====================
   CREATE ENEMY
===================== */

function createEnemy() {

    if (!gameRunning)
        return;

    let enemy =
        document.createElement("div");

    enemy.className =
        "car enemy";

    let roadLeft =
        game.clientWidth * 0.15;

    let roadWidth =
        game.clientWidth * 0.70;

    let x =
        roadLeft +
        Math.random() *
        (roadWidth - 50);

    enemy.style.left =
        x + "px";

    enemy.style.top =
        "-100px";

    game.appendChild(enemy);

    enemies.push(enemy);
}


/* =====================
   PLAYER MOVEMENT
===================== */

function updatePlayer() {

    let roadLeft =
        game.clientWidth * 0.15;

    let roadRight =
        game.clientWidth * 0.85;

    if (moveLeft) {

        playerX -= 8;
    }

    if (moveRight) {

        playerX += 8;
    }

    /* Keep inside road */

    if (playerX < roadLeft) {

        playerX = roadLeft;
    }

    if (playerX >
        roadRight - 50) {

        playerX =
            roadRight - 50;
    }

    player.style.left =
        playerX + "px";
}


/* =====================
   COLLISION
===================== */

function collision(a, b) {

    let r1 =
        a.getBoundingClientRect();

    let r2 =
        b.getBoundingClientRect();

    return !(
        r1.right < r2.left ||
        r1.left > r2.right ||
        r1.bottom < r2.top ||
        r1.top > r2.bottom
    );
}


/* =====================
   GAME LOOP
===================== */

function gameLoop() {

    if (!gameRunning)
        return;

    updatePlayer();

    moveRoad();


    for (let i = enemies.length - 1;
         i >= 0;
         i--) {

        let enemy =
            enemies[i];

        let y =
            parseFloat(enemy.style.top);

        y += speed;

        enemy.style.top =
            y + "px";


        /* Enemy passed */

        if (y >
            game.clientHeight) {

            enemy.remove();

            enemies.splice(i, 1);

            score++;

            scoreDisplay.innerText =
                "Score: " + score;


            /* Increase difficulty */

            if (score % 5 === 0) {

                speed += 0.5;
            }
        }


        /* Collision */

        if (collision(player, enemy)) {

            endGame();
        }
    }

    requestAnimationFrame(gameLoop);
}


/* =====================
   GAME OVER
===================== */

function endGame() {

    gameRunning = false;

    document.getElementById(
        "finalScore"
    ).innerText = score;

    document.getElementById(
        "gameOver"
    ).style.display = "block";
}


/* =====================
   RESTART
===================== */

document.getElementById(
    "restart"
).addEventListener(
    "click",
    function() {

        location.reload();
    }
);


/* =====================
   SPAWN ENEMIES
===================== */

setInterval(
    function() {

        if (gameRunning) {

            createEnemy();
        }

    },
    1000
);


/* START */

gameLoop();

</script>

</body>
</html>
